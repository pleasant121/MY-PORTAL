<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="h.css">
  <title>View Students</title>
</head>
<body><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
      <!-- Student Table Section -->
      <section class="student-section">
        <h2>Registered Students</h2>
        <table>
          <thead>
            <tr>
            <th>fullName</th>
        <th>department</th>
        <th>level</th>
        <th>phone</th>
        <th>school</th>
        <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
            </table>
                    <p><a href="dashboard.html"><B>BACK TO DASHBORD</B></p>

            <!-- 🔹 View Student Modal -->
  <div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Student Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>
</body>
</html>


  <!-- Firebase SDKs -->
   <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc,
    getDoc,
  } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyDc-n6pFi-lCyq-vBSfejXhTisjCv_QrKA",
  authDomain: "myportal-febda.firebaseapp.com",
  projectId: "myportal-febda",
  storageBucket: "myportal-febda.firebasestorage.app",
  messagingSenderId: "118865235361",
  appId: "1:118865235361:web:2df541c18cd2a14e3b4fe0",
  measurementId: "G-3GSQP4K061"
};
    // 🔹 Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 🔹 Reference to the table body
    const tableBody = document.querySelector("StudentTableBody");

    // 🔹 Fetch students from Firestore
    async function loadStudents() {
      studentTableBody.innerHTML = ""; // clear old rows
      const querySnapshot = await getDocs(collection(db, "students"));
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${data.fullName}</td>
          <td>${data.department}</td>
          <td>${data.level}</td>
          <td>${data.phone}</td>
          <td>${data.school}</td>
          <td>
            <button class="view-btn" onclick="viewStudent('${docSnap.id}')">View</button>
            <button class="delete-btn" onclick="deleteStudent('${docSnap.id}')">Delete</button>
          </td>
        `;
        studentTableBody.appendChild(row);
      });
    }

    window.deleteStudent = async function(id) {
  if (confirm("Are you sure you want to delete this student?")) {
    try {
      await deleteDoc(doc(db, "students", id));
      alert("Student deleted successfully!");
      loadStudents(); // refresh the list
    } catch (error) {
      console.error("Error deleting student:", error);
      alert("Error deleting student: " + error.message);
    }
  }
};


        // 🔹 View student in a modal
    window.viewStudent = async function (id) {
      try {
        const docRef = doc(db, "students", id);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const d = docSnap.data();
          document.getElementById("modalBody").innerHTML = `
            <p><strong>Full Name:</strong> ${d.fullName}</p>
            <p><strong>Department:</strong> ${d.department}</p>
            <p><strong>Level:</strong> ${d.level}</p>
            <p><strong>Phone:</strong> ${d.phone}</p>
            <p><strong>School:</strong> ${d.school}</p>
          `;
          const modal = new bootstrap.Modal(document.getElementById("viewModal"));
          modal.show();
        }
      } catch (error) {
        alert("Error fetching student details: " + error.message);
      }
    };



    // 🔹 Load students on page start
    loadStudents();
  </script> 
  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  
</body>
</html>
